# Pre-commit hooks; run: pre-commit install && pre-commit run --all-files
# See https://pre-commit.com and CONTRIBUTING.md

default_language_version:
  node: "20"

repos:
  # Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Backend: Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend: ESLint + Prettier (requires Node)
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
      - id: frontend-format-check
        name: frontend format check
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
