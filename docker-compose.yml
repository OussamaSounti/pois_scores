# Morocco Spatial Dashboard — DB + Backend

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: poi_user
      POSTGRES_PASSWORD: poi_password
      POSTGRES_DB: poi_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poi_user -d poi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://poi_user:poi_password@db:5432/poi_db
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  #pgadmin to be able to inspect the databse on the pgadmin web interface 
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  pipeline:
    profiles:
      - pipeline
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://poi_user:poi_password@db:5432/poi_db
      LOG_LEVEL: info
      PIPELINE_VERSION: "1.0"
    command: ["python", "-m", "app.features.feature_pipeline", "weekly_continuous"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
