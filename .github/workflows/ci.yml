# CI: lint → test → build, for backend (FastAPI + pipeline) and frontend (React).
# Integration tests run against a real PostGIS service container with the CI
# schema applied, so the SCD2 temporal predicates are exercised, not mocked.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/
      - run: ruff format --check backend/

  backend-test:
    name: Backend · pytest (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_DB: poi_db
          POSTGRES_USER: poi_user
          POSTGRES_PASSWORD: poi_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poi_user -d poi_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://poi_user:poi_password@localhost:5432/poi_db
      TRANSACTIONS_TABLE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Apply CI schema (active.* / history.* / production.* / geo.*)
        run: |
          python scripts/schema/apply_init.py
          python scripts/schema/apply_feature_pipeline.py
      - name: Run tests with coverage gate
        working-directory: backend
        # Ratchet: current coverage is ~54% (API + scoring core well covered; the
        # multiprocessing pipeline jobs are not). Raise as pipeline tests land.
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=50

  backend-build:
    name: Backend · docker build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: pois-scores-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
